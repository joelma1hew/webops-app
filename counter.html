```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>

<body>

    <h1>Counter</h1>

    <h2 id="count">0</h2>

    <button onclick="increase()">Increase</button>
    <button onclick="decrease()">Decrease</button>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").textContent = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").textContent = count;
        }
    </script>

</body>
</html>
```
